<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D Web Viewer Ver.1.0</title>
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.1.0/model-viewer.min.js"></script>
<style>
:root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", sans-serif; }
* { box-sizing: border-box; }
body { margin: 0; background: #111827; color: #f9fafb; }
main { max-width: 960px; margin: auto; padding: 24px 16px; }
h1 { font-size: 22px; margin: 0 0 6px; }
p { color: #aeb9c9; font-size: 14px; }
model-viewer { width: 100%; height: min(70vh, 650px); min-height: 360px; background: radial-gradient(circle, #e5e7eb, #a6afbd); border-radius: 16px; --progress-bar-color: #38bdf8; }
.controls { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
button { border: 1px solid #566174; background: #243145; color: white; border-radius: 10px; padding: 12px 18px; cursor: pointer; font-size: 14px; }
button:hover { background: #34445b; }
#status { margin-top: 12px; }
</style>
</head>
<body>
<main>
<h1>🚀 3D Web Viewer <small>Ver.1.0</small></h1>
<p>Scaniverseで作成したコーヒー缶の3Dモデル｜ドラッグで回転・スクロールで拡大縮小</p>
<model-viewer id="viewer" src="./coffee-can.glb" alt="Scaniverseで撮影したコーヒー缶の3Dモデル" camera-controls auto-rotate shadow-intensity="0.8" exposure="1" interaction-prompt="auto" touch-action="pan-y"></model-viewer>
<div class="controls">
<button id="rotation" type="button">自動回転を停止</button>
<button id="reset" type="button">視点をリセット</button>
</div>
<p id="status" role="status">3Dモデルを読み込み中…</p>
</main>
<script>
const viewer = document.querySelector('#viewer');
const status = document.querySelector('#status');
viewer.addEventListener('load', () => { status.textContent = '読み込み完了！ マウスや指で回転できます。'; });
viewer.addEventListener('error', () => { status.textContent = '読み込めませんでした。HTTPサーバーから開いているか、GLBファイルが同じフォルダにあるか確認してください。'; });
document.querySelector('#rotation').addEventListener('click', (e) => {
  const enabled = viewer.hasAttribute('auto-rotate');
  viewer.toggleAttribute('auto-rotate', !enabled);
  e.currentTarget.textContent = enabled ? '自動回転を開始' : '自動回転を停止';
});
document.querySelector('#reset').addEventListener('click', () => { viewer.cameraOrbit = 'auto auto auto'; viewer.fieldOfView = 'auto'; viewer.jumpCameraToGoal(); });
</script>
</body>
</html>
